version: '3.8'

services:
  # Node.js REST API
  backend-node:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - JWT_SECRET=supersecret_community_key
    depends_on:
      - postgres

  # Go WebSocket Chat Engine
  chat-service:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - JWT_SECRET=supersecret_community_key
      - ALLOWED_ORIGIN=http://localhost:5173

  # Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: community_db
    ports:
      - "5432:5432"